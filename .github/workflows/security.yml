name: Security Scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Generate security report
        run: python3 scanner/scanner.py

      - name: Show report
        run: cat reports/report.json

      - name: Upload report
        uses: actions/upload-artifact@v5
        with:
          name: security-scan-report
          path: reports/report.json
